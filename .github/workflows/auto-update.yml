name: 报刊数据库自动更新

on:
  # 每周一和周四北京时间上午9点自动运行（UTC凌晨1点）
  schedule:
    - cron: '0 1 * * 1,4'
  # 支持手动触发
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      
    - name: 设置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        
    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: 运行更新脚本
      run: |
        python update_database.py
        
    - name: 提交更新
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add data.js articles.jsonl seen_urls.json
        git diff --staged --quiet || git commit -m "自动更新: $(date -u '+%Y-%m-%d %H:%M') UTC"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
